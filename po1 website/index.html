<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#031512">
<title>Sign in</title>
<link rel="stylesheet" href="signin.css">
</head>
<body>
<canvas id="pcb" aria-hidden="true"></canvas>
<div class="formulas" aria-hidden="true"></div>
<div class="vig"></div><div class="scan"></div>
<main>
  <section class="panel" aria-label="Sign in">
    <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
    <div class="bar"><span class="led r"></span><span class="led a"></span><span class="led g"></span><span class="title">ACCESS TERMINAL</span><span class="rev">v1.0</span></div>
    <div class="hero">
      <svg class="atom" viewBox="-60 -60 120 120" aria-hidden="true">
        <ellipse rx="52" ry="19"/><ellipse rx="52" ry="19" transform="rotate(60)"/><ellipse rx="52" ry="19" transform="rotate(120)"/>
        <circle class="nuc" r="7"/>
        <circle class="el" r="3"><animateMotion dur="2.6s" repeatCount="indefinite" path="M52,0 A52,19 0 1,1 -52,0 A52,19 0 1,1 52,0"/></circle>
        <g transform="rotate(60)"><circle class="el" r="3"><animateMotion dur="3.2s" repeatCount="indefinite" path="M52,0 A52,19 0 1,1 -52,0 A52,19 0 1,1 52,0"/></circle></g>
        <g transform="rotate(120)"><circle class="el" r="3"><animateMotion dur="3.8s" repeatCount="indefinite" path="M52,0 A52,19 0 1,1 -52,0 A52,19 0 1,1 52,0"/></circle></g>
      </svg>
      <h1>SIGN IN</h1>
      <p class="sub">enter your ID and password to power the circuit</p>
    </div>
    <div class="log" aria-hidden="true"></div>
    <form id="f" autocomplete="off" novalidate>
      <label class="field"><span class="lab"><i>▸</i>USER ID</span>
        <span class="inp"><input id="uid" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="enter your id"></span></label>
      <label class="field"><span class="lab"><i>▸</i>PASSWORD</span>
        <span class="inp"><input id="pwd" type="password" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="••••••••"><button type="button" id="eye" aria-label="Show or hide password">SHOW</button></span></label>
      <button class="go" type="submit"><span>AUTHENTICATE</span><b>→</b></button>
    </form>
    <p id="msg" role="status" aria-live="polite"></p>
    <p id="hint"></p>
    <div class="meter"><div class="cells"></div><span class="pct">0%</span></div>
  </section>
</main>
<div id="flash"></div>
<script src="signin.js"></script>
</body>
</html>
